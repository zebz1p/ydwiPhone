/* 화면 가득 사용하며, 상단/하단 고정 · 본문만 스크롤 */
html,body,#app{width:100%;max-width:100%;height:100%;height:100dvh;overflow:hidden}
.top-wrap{padding-top:env(safe-area-inset-top,0px)}
.shell{width:100%;max-width:680px;margin:0 auto}
#content{width:100%;height:100%;min-height:0;flex:1;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
.call-list{width:100%;max-width:680px;margin:0 auto;padding-top:3px;padding-bottom:32px}
.record-detail{width:100%;max-width:680px;margin:0 auto}
.head-main{height:113px;padding:8px 20px 14px}
.header-large{font-size:34px}
.back-button{padding:9px 3px;font-weight:560}
.muted-control{font-size:16px;color:#A1A1A7;cursor:default;user-select:none}
.call-caption{gap:0}
.call-row{gap:12px;min-width:0}
.call-row-body{min-width:0}
.call-row-right{gap:8px}

.detail-action:disabled{opacity:1;cursor:default}
.detail-action:disabled:active{background:#fff}
.footer .tab:disabled{opacity:1;cursor:default}
.footer .tab:disabled:active{background:transparent}
.call-overlay[hidden],.dialog-note[hidden]{display:none!important}
@media(max-width:350px){.call-row{padding-left:13px;padding-right:13px;gap:10px}.avatar{width:40px;height:40px}.call-name{font-size:15px}.call-date{font-size:12px}.call-row-right{gap:4px}.head-main{padding-left:16px;padding-right:16px}}

/* index 잠금화면의 메시지 알림 디자인을 닮은 두 장의 연속 알림 */
#incoming-messages[hidden]{display:none!important}
#incoming-messages{position:fixed;z-index:70;left:12px;right:12px;top:calc(67px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.incoming-message{width:min(100%,520px);min-height:73px;padding:13px 16px;border-radius:21px;display:flex;align-items:center;gap:12px;color:#111;background:#F5F5F7;box-shadow:0 4px 16px rgba(27,36,49,.15);border:1px solid #e6e6e9;animation:incoming-rise .32s cubic-bezier(.22,.78,.2,1) both}
.incoming-message .incoming-icon{height:40px;width:40px;flex:none;border-radius:10px;background:#30D158;display:grid;place-items:center;color:#fff}
.incoming-message .incoming-icon svg{width:29px;height:29px;fill:#fff;stroke:none}
.incoming-copy{min-width:0;flex:1}.incoming-sender{font-size:15px;font-weight:670;line-height:1.4;margin-bottom:3px}.incoming-text{font-size:15px;font-weight:400;line-height:1.45;overflow-wrap:anywhere}
@keyframes incoming-rise{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.call-row.is-static{cursor:default;user-select:none}.call-row.is-static:active{background:#fff;opacity:1}.call-row.is-static .call-row-right{padding-right:4px}
.call-row:not(.is-static){cursor:pointer}.call-row:not(.is-static):active{background:#f4f8fd}
/* 어두운 아이폰 통화 진행 화면 - 오버레이 내의 별도 레이아웃 */
#call-overlay.live-call{position:fixed;inset:0;z-index:100;background:#1e1e1e;color:white;padding:calc(78px + env(safe-area-inset-top,0px)) 15px calc(24px + env(safe-area-inset-bottom,0px));display:block;text-align:center;width:100%;height:100%;height:100dvh;overflow:hidden}
.live-call .call-top{display:flex;flex-direction:column;align-items:center;gap:7px}
.live-call .live-status{font-size:18px;line-height:24px;font-weight:400;color:#a7a7a7;font-variant-numeric:tabular-nums}
.live-call .live-name{font-size:clamp(29px,8vw,35px);font-weight:600;line-height:1.35;letter-spacing:-.7px;color:#fff;margin:0}
.live-call .live-dialogue{position:absolute;left:3%;width:94%;bottom:calc(clamp(249px,39dvh,342px) + env(safe-area-inset-bottom,0px));text-align:center;transition:opacity .22s ease;color:#fff;min-height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.live-call .live-speaker{color:#aeb1b7;font-size:13px;font-weight:550;letter-spacing:.2px;line-height:1.4}
.live-call .live-phrase{display:inline-block;flex:none;width:max-content;max-width:none;white-space:nowrap;font-size:18px;line-height:1.5;font-weight:530;letter-spacing:-.55px;word-break:normal;overflow-wrap:normal}
.live-call .live-controls{position:absolute;bottom:calc(clamp(25px,5dvh,67px) + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(100%,410px);padding:0 clamp(21px,6vw,38px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4dvh,22px) 10px;justify-items:center}
.live-call .live-control-wrap{display:flex;align-items:center;flex-direction:column;gap:8px;min-width:0}
.live-call .live-control{height:clamp(59px,17vw,72px);width:clamp(59px,17vw,72px);border-radius:50%;background:#464646;display:grid;place-items:center;color:#fff}
.live-call .live-control svg{width:29px;height:29px;fill:#fff;stroke:none}
.live-call .live-control svg.outline{stroke:white;fill:none;stroke-width:2}
.live-call .live-control-label{color:#fff;font-size:12px;font-weight:430;white-space:nowrap;line-height:1.5}
.live-call button.live-end{background:#FF3B30;cursor:pointer}
.live-call button.live-end:active{background:#e52e28}
.live-call .live-control-wrap:not(:has(button)){cursor:default}
@media(max-height:690px){.live-call .live-dialogue{bottom:calc(227px + env(safe-area-inset-bottom,0px))}.live-call .live-controls{gap:10px 7px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}.live-call .live-control{height:57px;width:57px}}
@media(prefers-reduced-motion:reduce){.incoming-message{animation:none}.live-call .live-dialogue{transition:none}}

/* ─────────────────────────────────────────────────────────────
   DBS / 메시지 앱과 동일한 전체 화면 반응형 레이아웃
   고정된 540px · 680px 페이지 프레임을 해제합니다.
   상단과 하단은 브라우저 전체 너비, 본문 콘텐츠만 가운데 정렬.
   기존 목록·문자 알림·통화 시뮬레이션에는 영향을 주지 않습니다.
   ───────────────────────────────────────────────────────────── */
#app, .top-wrap, #content, .footer {
  width: 100%;
  max-width: none;
}
.top-wrap { border-bottom: 1px solid var(--divider); }
.top-wrap .shell, .footer .shell {
  width: 100%;
  max-width: none;
  margin: 0;
  border-left: 0;
  border-right: 0;
}
#content {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  max-width: none;
  margin: 0;
  border-left: 0;
  border-right: 0;
  overflow-x: hidden;
  overflow-y: auto;
}
.call-list, .record-detail {
  width: 100%;
  max-width: 680px;
  margin-left: auto;
  margin-right: auto;
}
.footer {
  display: block;
  flex-shrink: 0;
}
.footer .shell {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (min-width: 700px) {
  .top-wrap .shell, .footer .shell { max-width: none; }
  #content { width: 100%; max-width: none; margin: 0; border: 0; }
  .footer { display: block; }
}

function messagesFooter(){return `<span class="sms-compose-plus" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M6 12h12"/></svg></span><input id="sms-compose-input" class="sms-compose-field" type="text" placeholder="iMessage" aria-label="메시지 입력" autocomplete="off" enterkeyhint="send"><button type="button" class="sms-compose-mic" id="sms-send-button" data-action="send-message" aria-label="메시지 보내기" disabled>${micIcon}</button>`;}
function updateSmsSendButton(){const input=document.getElementById('sms-compose-input'),send=document.getElementById('sms-send-button');if(!input||!send)return;const hasText=!!input.value.trim();send.disabled=!hasText;send.classList.toggle('sms-compose-send',hasText);send.innerHTML=hasText?sendIcon:micIcon;}
function sendSmsMessage(){const input=document.getElementById('sms-compose-input');if(page!=='messages'||!input)return;const value=input.value.trim();if(!value)return;userSentMessages.push(value);const container=content.querySelector('.sms-chat-content');const previous=container.querySelector('.sms-chat-row:last-child');if(previous?.classList.contains('sent')){previous.classList.remove('tail');previous.querySelector('.sms-tail')?.remove();}container.insertAdjacentHTML('beforeend',smsRow(value,true));input.value='';updateSmsSendButton();content.scrollTop=content.scrollHeight;input.focus();}
let contactScroll=0,messageOriginPage='detail';
function render(){document.querySelector('.top-wrap').classList.toggle('contact-top',(page==='detail'||page==='missedDetail'));header.innerHTML=renderHeader();content.innerHTML=page==='messages'?messagesPage():page==='recent'?recentPage():page==='detail'?detailPage():page==='missedDetail'?missedDetailPage():page==='voicemail'?vmHome():page==='deleted'?vmList():vmDetail();footer.hidden=page==='voicemailDetail';footer.classList.toggle('sms-footer',page==='messages');tabs.innerHTML=page==='messages'?messagesFooter():renderFooter();content.style.background='#fff';content.scrollTop=0;if(page==='voicemailDetail')updatePlayer();}
function go(next,id=null){closeMenu();closeDialog();pause();page=next;focusedId=id;render();}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.record!==undefined){const c=CALLS.find(x=>x.id===Number(b.dataset.record));if(c?.enabled){if(c.id===19)go('missedDetail',19);else if(c.name==='영현이 형')go('detail',0);else openDirectCall(c);}return;}switch(b.dataset.action){case 'send-message':sendSmsMessage();break;case 'open-messages':messageOriginPage=page;contactScroll=content.scrollTop;go('messages');content.scrollTop=content.scrollHeight;break;case 'call-younghyun':openDirectCall(CALLS.find(c=>c.id===0));break;case 'toggle-menu':toggleMenu();break;case 'menu-recent':go('recent');break;case 'menu-voicemail':go('voicemail');break;case 'close-menu':closeMenu();break;case 'block-contact':showBlockDialog();break;case 'close-dialog':closeDialog();break;case 'confirm-block':showBlockResult();break;case 'end-direct-call':endDirectCall();break;case 'voicemail':go('voicemail');break;case 'deleted':go('deleted');break;case 'open-voicemail':seconds=0;go('voicemailDetail');break;case 'back':if(page==='messages'){go(messageOriginPage,messageOriginPage==='missedDetail'?19:0);content.scrollTop=contactScroll;}else go(page==='voicemailDetail'?'deleted':page==='deleted'?'voicemail':'recent');break;case 'play':play();break;case 'rewind':seek(seconds-15);break;case 'forward':seek(seconds+15);break;}});
document.addEventListener('input',event=>{if(event.target.id==='vm-seek')seek(Number(event.target.value));if(event.target.id==='sms-compose-input')updateSmsSendButton();});
// 한글 조합을 확정하는 Enter는 전송으로 처리하지 않습니다.
document.addEventListener('compositionstart',event=>{if(event.target.id==='sms-compose-input')smsComposing=true;});
document.addEventListener('compositionend',event=>{if(event.target.id==='sms-compose-input'){smsComposing=false;smsCompositionEndedAt=performance.now();updateSmsSendButton();}});
window.addEventListener('pagehide',pause);
const menuLayer=document.createElement('div');menuLayer.id='phone-menu-layer';menuLayer.hidden=true;document.getElementById('app').append(menuLayer);
const dialogLayer=document.createElement('div');dialogLayer.id='contact-dialog-layer';dialogLayer.hidden=true;document.getElementById('app').append(dialogLayer);
const directCall=document.getElementById('call-overlay');
function closeMenu(){menuOpen=false;menuLayer.hidden=true;header.innerHTML=renderHeader();}
function toggleMenu(){if(menuOpen){closeMenu();return;}menuOpen=true;header.innerHTML=renderHeader();menuLayer.innerHTML=`<button class="menu-dismiss" data-action="close-menu" aria-label="메뉴 닫기"></button><div class="phone-menu" role="menu"><button role="menuitemradio" aria-checked="${page==='recent'}" data-action="menu-recent"><span class="menu-check">${page==='recent'?'✓':''}</span>${icon('phone')}통화</button><button role="menuitemradio" aria-checked="${page==='voicemail'}" data-action="menu-voicemail"><span class="menu-check">${page==='voicemail'?'✓':''}</span><svg viewBox="0 0 24 24"><circle cx="5" cy="11" r="4"/><circle cx="19" cy="11" r="4"/><path d="M5 15h14"/></svg>음성 메시지</button></div>`;menuLayer.hidden=false;}
function closeDialog(){dialogLayer.hidden=true;}
function showBlockDialog(){dialogLayer.innerHTML=`<div class="contact-dialog" role="alertdialog" aria-modal="true" aria-label="연락처 차단 확인"><p>차단된 연락처로부터 전화, 메시지, 이메일 또는 FaceTime을 받을 수 없게 됩니다.</p><div class="dialog-actions"><button data-action="close-dialog">취소</button><button class="block-contact" data-action="confirm-block">연락처 차단</button></div></div>`;dialogLayer.hidden=false;dialogLayer.querySelector('button').focus();}
function showBlockResult(){dialogLayer.innerHTML=`<div class="contact-dialog" role="alertdialog" aria-modal="true" aria-label="차단 안내"><p>차단을 어예 하노...</p><div class="dialog-actions"><button data-action="close-dialog">확인</button></div></div>`;dialogLayer.querySelector('button').focus();}

};
function control(kind,label,enabled=false){const svg=`<svg viewBox="0 0 24 24" aria-hidden="true">${callIcons[kind]}</svg>`;return `<div class="live-control-wrap">${enabled?`<button type="button" class="live-control live-end" data-action="end-direct-call" aria-label="통화 종료">${svg}</button>`:`<div class="live-control" aria-hidden="true">${svg}</div>`}<span class="live-control-label">${label}</span></div>`}
function showCallLine(line){
 const speaker=directCall.querySelector('#live-speaker'),phrase=directCall.querySelector('#live-phrase');
 if(speaker)speaker.textContent=line.speaker;
 if(!phrase)return;
 phrase.textContent=line.text;
 // 한 줄로 표시: 글자 수뿐 아니라 iPhone 실제 렌더링 폭에 맞춰 글씨 크기를 조절합니다.
 const parent=phrase.parentElement;
 const allowedWidth=Math.max(120,parent.clientWidth-6);
 let size=18;
 phrase.style.fontSize=size+'px';
 while(phrase.getBoundingClientRect().width>allowedWidth&&size>10){
  size-=0.25;
  phrase.style.fontSize=size+'px';
 }
}
const PHONE_DIALOGUES={"영현이 형": [{"speaker": "강영현", "text": "어 도운이 살아있었네?"}, {"speaker": "윤도운", "text": "누가 할 소리를"}, {"speaker": "강영현", "text": "전화는 왜 안 받아"}, {"speaker": "윤도운", "text": "먼저 안 받은 게 누군데"}, {"speaker": "윤도운", "text": "누구때문에 수업 못 가서 교수님 보고 왔다"}, {"speaker": "강영현", "text": "아 미안..."}, {"speaker": "강영현", "text": "나 방금 일어나 가지고"}, {"speaker": "윤도운", "text": "그래 보이네 목소리가"}, {"speaker": "강영현", "text": "그, 아..."}, {"speaker": "윤도운", "text": "뭐"}, {"speaker": "강영현", "text": "나 어제 너한테 뭐 실수한 거 없지?"}, {"speaker": "윤도운", "text": "무슨 실수"}, {"speaker": "강영현", "text": "아이 그냥 뭐 이것저것"}, {"speaker": "윤도운", "text": "형은 몰라도"}, {"speaker": "윤도운", "text": "나는 실수 아니었는데"}, {"speaker": "강영현", "text": "도운아"}, {"speaker": "윤도운", "text": "얼굴 보고 얘기하자 나온나"}], "성유찬(실음)": [{"speaker": "성유찬", "text": "야 안 오냐? 교수님이,"}, {"speaker": "윤도운", "text": "야"}, {"speaker": "성유찬", "text": "왜"}, {"speaker": "윤도운", "text": "내 했다"}, {"speaker": "성유찬", "text": "뭘"}, {"speaker": "윤도운", "text": "강영현이랑 키스했다고"}, {"speaker": "성유찬", "text": "개소리야 잠 덜 깼냐?"}, {"speaker": "성유찬", "text": "중삐리도 아니고 존나 건강,"}, {"speaker": "윤도운", "text": "아니 씨, 진짜라고"}, {"speaker": "성유찬", "text": "아 예..."}, {"speaker": "성유찬", "text": "다시 잠이나 자라 그냥"}], "최성원(경영)": [{"speaker": "최성원", "text": "후문 할맥"}, {"speaker": "윤도운", "text": "안 간다"}, {"speaker": "최성원", "text": "그럼 형 그냥 여기 버림 우리 3차 갈 거야"}, {"speaker": "윤도운", "text": "택시 태워가 보내라 인성 문제 있나"}, {"speaker": "최성원", "text": "아니 형 계속 니 찾는다니까"}, {"speaker": "윤도운", "text": "하...."}]};
let callSession=null,callGeneration=0;
function phoneLineDuration(text,name=''){return Math.round(Math.max(1050,Math.min(3300,700+Array.from(text).length*65))*1.12*(name==='영현이 형'?1.3:1));}
// 연결음은 제외하고, 마지막 대사 뒤 자동 종료 대기 1초는 포함합니다.
function plannedCallSeconds(name){return Math.floor(((PHONE_DIALOGUES[name]||[]).reduce((sum,line)=>sum+phoneLineDuration(line.text,name),0)+1000)/1000);}
function openDirectCall(contact){endDirectCall();pause();directCall.className='call-overlay live-call';directCall.innerHTML=`<div class="call-top"><span class="live-status" id="live-status">휴대전화 연결 중...</span><h2 class="live-name">${esc(contact.name)}</h2></div><div class="live-dialogue"><span class="live-speaker" id="live-speaker"></span><span class="live-phrase" id="live-phrase"></span></div><div class="live-controls">${control('speaker','스피커')}${control('video','FaceTime')}${control('mute','소리 끔')}${control('dots','더 보기')}${control('hangup','종료',true)}${control('keypad','키패드')}</div>`;directCall.hidden=false;directCall.querySelector('button').focus();startPhoneSequence(contact);}
function startPhoneSequence(contact){
 const session={id:++callGeneration,contact,ring:null,timers:[],clock:null,connectedAt:null};callSession=session;
 const current=()=>callSession===session;
 const later=(fn,ms)=>{const id=setTimeout(()=>{if(current())fn();},ms);session.timers.push(id);return id;};
 const stopRing=()=>{if(session.ring){session.ring.pause();session.ring.removeAttribute('src');session.ring.load();}};
 const connect=()=>{if(!current()||session.connectedAt!==null)return;stopRing();session.connectedAt=Date.now();
  const clock=()=>{const status=directCall.querySelector('#live-status');if(status)status.textContent=fmt((Date.now()-session.connectedAt)/1000);};clock();session.clock=setInterval(clock,1000);
  const lines=PHONE_DIALOGUES[contact.name]||[];
  const show=index=>{if(!current())return;if(index>=lines.length){later(endDirectCall,1000);return;}showCallLine(lines[index]);later(()=>show(index+1),phoneLineDuration(lines[index].text,contact.name));};show(0);
 };
 if(contact.name!=='영현이 형'){connect();return;}
 const ring=session.ring=new Audio('sound/call.mp3');ring.loop=true;ring.volume=0.45;
 let scheduled=false;const schedule=()=>{if(!current()||scheduled)return;scheduled=true;later(connect,3000);};
 ring.addEventListener('playing',schedule,{once:true});ring.addEventListener('error',schedule,{once:true});
 try{const playback=ring.play();if(playback?.catch)playback.catch(schedule);}catch{schedule();}
 later(()=>{if(!scheduled)schedule();},3000);
}
function endDirectCall(){
 const session=callSession;callSession=null;callGeneration++;
 if(session){session.timers.forEach(clearTimeout);clearInterval(session.clock);if(session.ring){session.ring.pause();session.ring.removeAttribute('src');session.ring.load();}
  if(session.contact.name==='영현이 형'&&session.connectedAt!==null)younghyunCallSeconds=Math.floor((Date.now()-session.connectedAt)/1000);
 }
 directCall.hidden=true;directCall.innerHTML='';if(session&&page==='detail'){const pos=content.scrollTop;content.innerHTML=detailPage();content.scrollTop=pos;}
}
window.addEventListener('pagehide',endDirectCall);
window.addEventListener('resize',()=>{if(!callSession)return;const speaker=directCall.querySelector('#live-speaker'),phrase=directCall.querySelector('#live-phrase');if(phrase?.textContent)showCallLine({speaker:speaker.textContent,text:phrase.textContent});});
document.addEventListener('keydown',event=>{if(event.target.id==='sms-compose-input'&&event.key==='Enter'){event.preventDefault();if(event.isComposing||smsComposing||event.keyCode===229||event.repeat||performance.now()-smsCompositionEndedAt<120)return;sendSmsMessage();return;}if(event.key!=='Escape')return;if(!dialogLayer.hidden)closeDialog();else if(menuOpen)closeMenu();else if(!directCall.hidden)endDirectCall();});
render();
})();</script></body></html>
