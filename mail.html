$('scroll').addEventListener('click',e=>{const toggle=e.target.closest('[data-toggle]'),row=e.target.closest('[data-folder]'),mail=e.target.closest('[data-mail]');if(toggle){const y=$('scroll').scrollTop,id=toggle.dataset.toggle;opened.has(id)?opened.delete(id):opened.add(id);render(y)}else if(row){boxScroll=$('scroll').scrollTop;scope={account:row.dataset.account||null,folder:row.dataset.folder,title:row.dataset.title};view='list';render()}else if(mail){const m=mails.find(x=>x.id===mail.dataset.mail);if(m.previewOnly)return;if(m.folder==='drafts'){openCompose(m);return}listScroll=$('scroll').scrollTop;selected=m.id;m.unread=false;persist();view='detail';render()}else if(e.target.closest('[data-write]'))openCompose();else if(e.target.closest('[data-reply]')){const m=mails.find(x=>x.id===selected);openCompose({account:m.account,to:m.from,subject:m.subject.startsWith('Re:')?m.subject:'Re: '+m.subject,body:'\n\n나의 iPhone에서 보냄'})}});

function matches(rule,m){return rule.enabled&&(!rule.replyKey||rule.replyKey===m.replyKey)&&(!rule.once||!used.includes(rule.id))&&(!rule.to||rule.to.toLowerCase()===m.to.toLowerCase())&&(!rule.subjectIncludes||m.subject.includes(rule.subjectIncludes))&&(!rule.bodyIncludes||m.body.includes(rule.bodyIncludes))}

function fbAvatar(name=FACEBOOK.name){return name===FACEBOOK.name?`<img src="${esc(FACEBOOK.avatar)}" alt="">`:name==='윤도운'?`<img src="${esc(FACEBOOK.dowoonAvatar)}" alt="">`:`<span>${esc(name.slice(0,1))}</span>`}
function profileHTML(){return `<div class="fb-cover">${FACEBOOK.cover?`<img src="${esc(FACEBOOK.cover)}" alt="커버 사진">`:''}<button disabled class="fb-camera">${fbIcon('camera')}</button></div><div class="fb-profile"><div class="fb-avatar-wrap"><div class="fb-profile-avatar">${fbAvatar()}</div><button disabled class="fb-camera">${fbIcon('camera')}</button></div><h1>${esc(FACEBOOK.name)}</h1><div class="fb-profile-actions"><button disabled>⊕ 스토리에 추가</button><button disabled>${fbIcon('edit')}프로필 편집</button></div><div class="fb-lock"><span class="fb-lock-icon">${fbIcon('lock')}</span><div><b>프로필을 잠갔습니다</b><br><span class="blue">더 알아보기</span></div></div></div><div class="fb-tabs"><button disabled class="active">모두</button><button disabled>사진</button><button disabled>릴스</button></div><div class="fb-section"><div class="fb-section-heading"><b>친구</b><button disabled class="blue">모두 보기</button></div><h3>게시물</h3><div class="fb-composer"><div class="fb-mini-avatar">${fbAvatar()}</div><button disabled>상태 업데이트를 게시해보세요</button>${fbIcon('photo')}</div></div>${FACEBOOK.posts.map((p,i)=>`<article class="fb-post"><div class="fb-post-heading"><div class="fb-mini-avatar">${fbAvatar()}</div><div class="fb-post-head">${esc(FACEBOOK.name)}<small>${esc(p.date)} · ${fbIcon('lock')}</small></div><button class="fb-delete" disabled>삭제하기</button></div><p>${esc(p.text)}</p>${p.photos?.length?p.photos.map((src,j)=>`<img class="fb-photo" src="${esc(src)}" data-fb-photo="${i}:${j}" alt="강영현과 윤도운의 추억 사진">`).join(''):'<div class="fb-placeholder">함께 찍은 사진</div>'}<div class="fb-reactions"><span>👍 ${p.likes||0}</span><span>댓글 ${(p.comments||[]).length}개</span></div><div class="fb-post-actions"><button disabled>${fbIcon('like')}좋아요</button><button disabled>${fbIcon('comment')}댓글 달기</button><button disabled>${fbIcon('share')}공유하기</button></div><div class="fb-comments">${(p.comments||[]).map((c,j)=>`<div class="fb-comment"><div class="fb-mini-avatar">${fbAvatar(c.name)}</div><div class="fb-comment-main"><div class="fb-comment-bubble"><b>${esc(c.name)}</b><div>${esc(c.text)}</div></div><div class="fb-comment-meta"><span>${esc(c.date)}</span><button disabled>좋아요</button><button disabled>답글 달기</button><button disabled>삭제하기</button></div></div></div>`).join('')}</div></article>`).join('')}`}
function refreshFacebookProfile(){const scroller=$('fb-screen').querySelector('.fb-scroll'),top=scroller.scrollTop;scroller.innerHTML=profileHTML();scroller.scrollTop=top}
$('fb-screen').addEventListener('click',e=>{const photo=e.target.closest('[data-fb-photo]');if(!photo)return;const [i,j]=photo.dataset.fbPhoto.split(':').map(Number);$('fb-viewer').innerHTML=`<button class="circle" aria-label="사진 닫기">${icon('close')}</button><img src="${esc(FACEBOOK.posts[i].photos[j])}" alt="게시물 사진">`;$('fb-viewer').hidden=false});
$('fb-viewer').addEventListener('click',()=>{$('fb-viewer').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('fb-viewer').hidden)$('fb-viewer').hidden=true;else if(!$('fb-screen').hidden)closeFacebook();else hideMailNotice()}});
// 같은 탭에서 새로고침/재방문할 때 알림 중복 방지. 메일은 저장된 채로 유지됩니다.
// 처음부터 강영현 받은 편지함에 표시. 진입 알림은 사용하지 않습니다.
if(!mails.some(m=>m.id===facebookMailId)){mails.unshift(facebookMail());persist()}
render();

</script></body></html>
