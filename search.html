<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="format-detection" content="telephone=no,email=no,address=no"><title>방문 기록</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#080808;background:#f1f2f7;-webkit-text-size-adjust:100%}button{font:inherit;color:inherit;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}button:disabled{opacity:1;color:inherit;cursor:default}svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}#app{height:100vh;height:100dvh;display:flex;flex-direction:column;width:100%}.top{flex:none;padding:12px 16px 0;background:#f1f2f7;border-bottom:1px solid #d9dbe1}.tabs{display:flex;height:46px;border:1px solid #cfd1d7;border-radius:27px;background:#fff;padding:4px;align-items:center}.tabs button{flex:1;display:flex;align-items:center;justify-content:center;height:36px;border-radius:22px}.tabs .selected{background:#eeeef3}.title-row{display:flex;align-items:center;justify-content:space-between;padding:19px 0 10px;gap:16px}h1{font-size:34px;letter-spacing:-1.3px;margin:0;font-weight:750;line-height:1.2}.more{border:1px solid #d5d7de;border-radius:50%;width:46px;height:46px;background:#fff;display:flex;align-items:center;justify-content:center}.more svg{width:23px;height:23px}.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px 28px}.scroll::-webkit-scrollbar{display:none}.section-title{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 12px 1px;margin:0;font-size:18px;font-weight:650;letter-spacing:-.4px}.section-title svg{width:17px;height:17px;color:#909097;stroke-width:2.8}.section+.section{margin-top:14px}.history{border-radius:25px;background:#fff;overflow:hidden;list-style:none;padding:0;margin:0}.entry{display:flex;align-items:center;padding-left:18px;gap:18px;min-height:65px}.google{width:22px;height:22px;stroke:none;flex:none}.entry-text{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;padding:19px 14px 19px 0;margin-right:15px;font-size:15px;line-height:1.5;letter-spacing:-.25px;border-bottom:1px solid #e1e1e5;overflow-wrap:anywhere}.entry:last-child .entry-text{border-bottom:0}.bottom{flex:none;display:flex;align-items:center;gap:8px;padding:0 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid #dedfe6;background:#f1f2f7}.bottom button{height:50px;border:1px solid #cfd1d7;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center}.bottom .round{width:50px;flex:none}.bottom .back{color:#c7c7cc}.bottom .address{flex:1;min-width:0;gap:10px;padding:0 13px;color:#999a9f}.address span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}.address svg{width:21px;height:21px;color:#080808}.address .mic{margin-left:auto}.bottom .round svg{width:25px;height:25px}@media(min-width:600px){.entry-text{font-size:16px}.bottom .address span{flex:1;text-align:center}}@media(max-width:360px){.bottom{padding-left:12px;padding-right:12px;gap:6px}.bottom .round{width:44px;height:46px}.bottom .address{height:46px;gap:6px;padding:0 10px}.address span{font-size:12px}.entry{gap:14px;padding-left:15px}.entry-text{font-size:14px;margin-right:10px}.top,.scroll{padding-left:14px;padding-right:14px}}
</style></head><body><div id="app"><header class="top"><nav class="tabs" aria-label="Safari 메뉴"><button disabled aria-label="시작 페이지"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2 2h5v5H2zm7.5 0h5v5h-5zM17 2h5v5h-5zM2 9.5h5v5H2zm7.5 0h5v5h-5zm7.5 0h5v5h-5zM2 17h5v5H2zm7.5 0h5v5h-5zm7.5 0h5v5h-5z" style="fill:currentColor;stroke:none"/></svg></button><button disabled aria-label="책갈피"><svg viewBox="0 0 24 24"><path d="M12 5C9 2 5 2 2 4v17c3-2 7-2 10 0 3-2 7-2 10 0V4c-3-2-7-2-10 1Zm0 0v16"/></svg></button><button disabled aria-label="읽기 목록"><svg viewBox="0 0 30 24"><circle cx="8" cy="13" r="5"/><circle cx="23" cy="13" r="5"/><path d="M13 12c1-2 3-2 5 0M1 13h2m25 0h1"/></svg></button><button disabled class="selected" aria-label="방문 기록" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v7H7"/></svg></button></nav><div class="title-row"><h1>방문 기록</h1><button disabled class="more" aria-label="더 보기"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div></header><main class="scroll" id="history" aria-label="검색 방문 기록"></main><footer class="bottom"><button disabled class="round back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button><button disabled class="address" aria-label="웹사이트 검색 또는 입력"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><span>웹사이트 검색 또는 입력</span><svg class="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v3a7 7 0 0 0 14 0v-3M12 20v3m-4 0h8"/></svg></button><button disabled class="round" aria-label="탭"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M17 7V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></svg></button></footer></div>
<script>
// 검색 기록 수정: 각 문자열 한 줄이 검색 기록 한 개입니다. 추가/삭제 가능.
const HISTORY=[
 {title:'오늘 저녁',items:['콩나물국 맛있게만드는법','안매운해장국 레시피','해장국 레시피']},
 {title:'어제',items:['키스하고 친구로','친한친구랑 키스','짝사랑하던 사람이랑 키스']},
 {title:'지난 며칠',items:[
 '지심심할때만 연락하는 사람 심리',
 '강연현 보고싶다',

 '낚시 카페',
 '데이트로 낚시가 그렇게 별로인가요?',

 '10월에 카라반 안 춥나여',
 '카라반',
 '서울 근교 캠핑장',
 '차없이 갈 만한 캠핑장',

 '귀여운 강아지 영상'
 ]}
];
// 선명한 4색 Google G. 외부 이미지나 폰트를 불러오지 않습니다.
const GOOGLE=`<svg class="google" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.77 7.18l7.73 6C44.41 38.03 46.98 31.86 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>`;
const escapeText=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('history').innerHTML=HISTORY.map(section=>`<section class="section"><h2 class="section-title">${escapeText(section.title)}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 8 8 8 8-8"/></svg></h2><ul class="history">${section.items.map(query=>`<li class="entry">${GOOGLE}<span class="entry-text">${escapeText(query)} - Google 검색</span></li>`).join('')}</ul></section>`).join('');
</script></body></html>
