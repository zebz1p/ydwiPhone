// 위에서부터 내용 키워드를 우선 검사하고, 마지막에 호칭을 검사합니다.
// unique: true인 답변은 한 차례 모두 사용한 뒤 다시 무작위로 선택합니다.
const KEYWORD_REPLIES = [
 {key:'where',match:t=>t.includes('어디'),unique:true,replies:[['비밀'],['술 먹는 중'],['도우니 마음 속이지'],['집'],['어디게']]},
 {key:'meal',match:t=>t.includes('밥은'),unique:true,replies:[['너랑 먹으려고'],['아직']]},
 {key:'ate',match:t=>t.includes('밥먹었어'),replies:[['배고파']]},
 {key:'miss',match:t=>/보고싶(?:어|다)/.test(t),unique:true,replies:[['너 뭐 잘못했어?'],['뭐야 ㅋㅋㅋㅋ','갑자기?']]},
 {key:'doing',match:t=>/뭐(?:해|함)/.test(t),unique:true,replies:[['그냥 있엉']]},
 {key:'meet',match:t=>t.includes('만날래'),replies:[['드라이브 가고 싶긴 한데']]},
 {key:'dislike',match:t=>t.includes('싫어'),replies:[['응 나도 사랑해~']]},
 {key:'hate',match:t=>/미워|밉다/.test(t),replies:[['미안해']]},
 {key:'love',match:t=>t.includes('사랑해'),replies:[['그랭']]},
 {key:'like',match:t=>t.includes('좋아해'),replies:[['그래 형한테 잘해']]},
 {key:'fool',match:t=>t.includes('바보'),replies:[['죽는다']]},
 {key:'young',match:t=>t.includes('영현아'),replies:[['어쭈']]},
 {key:'fullname',match:t=>t.includes('강영현'),replies:[['응?']]},
 {key:'hyung',match:t=>t.includes('형'),replies:[['왜 도우니']]},
 {key:'hey',match:(t,raw)=>/(^|[^가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9_])야(?=$|[^가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9_])/.test(raw),replies:[['왜']]}
];
const usedKeywordReplies=new Map();
function findKeywordRule(text){
 const compact=text.replace(/\s+/g,'');
 return KEYWORD_REPLIES.find(rule=>rule.match(compact,text));
}
function pickKeywordReply(text){
 const rule=findKeywordRule(text);
 if(!rule)return null;
 const used=usedKeywordReplies.get(rule.key)||new Set();
 if(rule.unique&&used.size>=rule.replies.length)used.clear();
 const choices=rule.replies.map((lines,index)=>({lines,index})).filter(choice=>!rule.unique||!used.has(choice.index));
 if(!choices.length)return null;
 const choice=choices[Math.floor(Math.random()*choices.length)];
 if(rule.unique){used.add(choice.index);usedKeywordReplies.set(rule.key,used);}
 return choice.lines.map(text=>['them',text]);
}
function startKeywordReply(text){
 const lines=pickKeywordReply(text);if(!lines)return;
 enqueueStory(lines);releasePendingStories();
}

function enqueueStory(lines,{time}={}){storyQueue.push({lines,time,index:0,released:false,remaining:0});}
function releasePendingStories(){storyQueue.forEach(job=>job.released=true);if(!activeStory)pumpStory();}
function pumpStory(){
 if(storyTimer)return;
 if(!activeStory){if(!storyQueue[0]?.released)return;activeStory=storyQueue.shift();}
 const tick=()=>{storyTimer=null;if(!activeStory)return;
  if(!partnerRoomVisible()){partnerTyping=false;refreshStoryRoom();storyTimer=setTimeout(tick,200);return;}
  const line=activeStory.lines[activeStory.index];if(!line){activeStory=null;partnerTyping=false;refreshStoryRoom();pumpStory();return;}
  if(!activeStory.remaining){activeStory.remaining=line[0]==='them'?Math.min(2800,1000+line[1].length*65):1200;partnerTyping=line[0]==='them';refreshStoryRoom();}
  else if(line[0]==='them'&&!partnerTyping){partnerTyping=true;refreshStoryRoom();}
  activeStory.remaining-=200;
  if(activeStory.remaining<=0){partnerTyping=false;addStoryMessage(line[0],line[1],{time:activeStory.time});activeStory.index++;activeStory.remaining=0;}
  storyTimer=setTimeout(tick,200);
 };tick();
}

<script>

function finishRing(token){if(token!==generation||phase!=='ring')return;audio.pause();if(mode==='room'){stop('busy');return;}phase='connected';started=Date.now();clockText();clock=setInterval(clockText,500);showLine(0,token);}
function scheduleRing(){if(phase!=='ring'||ringScheduled)return;ringScheduled=true;clearTimeout(timer);const token=generation;timer=setTimeout(()=>finishRing(token),5000);}
