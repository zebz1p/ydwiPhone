  infinity:'<path d="M12 12C9 7 7 6 5 6a6 6 0 0 0 0 12c2 0 4-1 7-6s5-6 7-6a6 6 0 0 1 0 12c-2 0-4-1-7-6Z" transform="translate(2 2) scale(.833333)"/>',
  mix:'<circle cx="8" cy="12" r="6"/><circle cx="16" cy="12" r="6"/>',
  library:'<rect x="8.55" y="1.7" width="6.9" height="1.65" rx="0.82" fill="currentColor" stroke="none"/><rect x="6.95" y="4.2" width="10.1" height="1.75" rx="0.88" fill="currentColor" stroke="none"/><rect x="4.45" y="7.05" width="15.1" height="16.25" rx="3.35" fill="currentColor" stroke="none"/><path d="M14.5 10.3c.37-.08.72.2.72.58v5.95c0 1.42-1.19 2.42-2.86 2.42-1.45 0-2.52-.78-2.52-1.96 0-1.28 1.19-2.13 2.72-2.13.44 0 .88.08 1.28.22v-4.07c0-.32.22-.59.53-.66Zm-5.35 1.23c.37-.09.72.2.72.58v7.13c0 1.42-1.2 2.41-2.86 2.41-1.45 0-2.52-.77-2.52-1.95 0-1.28 1.19-2.13 2.72-2.13.45 0 .88.08 1.28.22v-5.49c0-.31.21-.58.51-.65Z" transform="translate(4.15 0) scale(.74)" fill="#fff" stroke="none"/>'
 };if(clean[name])return `<svg viewBox="0 0 24 24" aria-hidden="true">${clean[name]}</svg>`;
 if(name==='play')return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3Q6 2 7 3l14 8q1 1 0 2L7 21q-1 1-1-1Z"/></svg>';
if(name==='pause')return '<svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="5" height="20" rx="1.6"/><rect x="14" y="2" width="5" height="20" rx="1.6"/></svg>';if(name==='next'||name==='previous')return `<svg viewBox="0 0 24 24" aria-hidden="true"><g ${name==='previous'?'transform="rotate(180 12 12)"':''}><path d="M2 4Q2 3 3 4l10 7q1 1 0 2L3 20q-1 1-1-1ZM12 4q0-1 1 0l10 7q1 1 0 2l-10 7q-1 1-1-1Z"/></g></svg>`;if(name==='more')return '<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg>';return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"/></svg>`}
function cover(item){if(item.theme==='station'&&!item.image)return artwork('station');return item.image?`<img src="${esc(item.image)}" alt="" draggable="false" onerror="this.hidden=true">`:`<span class="placeholder">${icon('note')}</span>`}
function artwork(theme){
 // 스테이션 카드와 같은 선명한 색면 레이어. 카드별로 서로 다른 오브제를 크게 배치합니다.
 const shapes={
  // 원래의 윤도운 스테이션 삼각 그래픽은 그대로 유지합니다.
  station:'<path d="M0 0 300 170 0 340Z" fill="#ff822d"/><path d="M0 0 240 170 0 340 95 170Z" fill="#ff9b67"/><path d="M0 0 165 170 0 340 60 170Z" fill="#ff6588"/>',
  // 말하지 못한 마음: 하나의 커다란 하트를 겹쳐 접힌 색면처럼 표현.
  heart:'<path d="M150 293 43 190C13 163 11 119 36 83 63 45 115 50 150 94 185 50 237 45 264 83c25 36 23 80-7 107Z" fill="#ffe1ed"/><path d="M150 293 45 189C16 161 15 119 39 86c22-30 61-32 89-10l22 18v199Z" fill="#ffaccd"/><path d="M150 293 72 182C47 148 52 112 78 97c27-17 54 0 72 26Z" fill="#ff699d"/><path d="M150 293 256 190c30-30 31-71 8-107-8-11-18-19-29-23L150 121Z" fill="#ffc5d9"/><path d="M150 293 205 154 150 121Z" fill="#ff88ad"/>',
  // 혹시 너도 같은 마음일까: 커다란 러브레터를 종이를 포갠 듯한 색면으로.
  spark:'<path d="M57 101h186c12 0 22 10 22 22v153H35V123c0-12 10-22 22-22Z" fill="#fff0d5"/><path d="M65 73h170v146H65Z" fill="#fff7eb"/><path d="M82 102h136v13H82ZM82 127h103v10H82Z" fill="#ffd5ab"/><path d="M35 119 150 214 265 119v157H35Z" fill="#ffbd88"/><path d="M35 119 150 214 35 276Z" fill="#ffe2c0"/><path d="M265 119 150 214 265 276Z" fill="#ff9f73"/><path d="M35 276 150 187 265 276Z" fill="#ffe9cd"/><path d="M150 211c-19-14-29-24-29-36 0-9 6-15 14-15 7 0 12 4 15 10 3-6 8-10 15-10 8 0 14 6 14 15 0 12-10 22-29 36Z" fill="#fb6592"/>',
  // 드러머의 플레이리스트: 겹쳐진 종이 조형처럼 큼직한 드럼통과 스틱.
  drum:'<path d="M42 157v103c0 25 48 44 108 44s108-19 108-44V157Z" fill="#aecaff"/><path d="M42 162 91 294l28-111 31 121 29-121 30 111 49-132v98c0 25-48 44-108 44S42 285 42 260Z" fill="#79a6fa"/><path d="M42 163 92 287 119 181Z" fill="#d4e2ff"/><path d="M119 181 150 298 179 181Z" fill="#b5d1ff"/><path d="M179 181 209 287 258 163Z" fill="#d4e2ff"/><ellipse cx="150" cy="160" rx="108" ry="45" fill="#e3edff"/><ellipse cx="150" cy="160" rx="97" ry="34" fill="#80aaff"/><path d="M53 160c0 10 12 19 29 25 14-30 36-48 68-59-56 0-97 14-97 34Z" fill="#a6c5ff"/><path d="M76 137 171 179" fill="none" stroke="#ecf3ff" stroke-width="9" stroke-linecap="round"/><path d="M222 137 131 179" fill="none" stroke="#b8d1ff" stroke-width="9" stroke-linecap="round"/>',
 };
 return `<svg class="art" viewBox="0 0 300 340" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${shapes[theme]||shapes.heart}</svg>`;
}
$('recommendations').innerHTML=MUSIC.recommendations.map(r=>`<article class="recommend-card" style="--color:${esc(r.color)}"><div class="art-area">${artwork(r.theme)}</div>${r.image?`<img class="cover" src="${esc(r.image)}" alt="" draggable="false" onerror="this.hidden=true">`:''}<div class="brand">♪ music</div><div class="rec-copy"><small>${esc(r.subtitle)}</small><strong>${esc(r.title)}</strong><p>${esc(r.description)}</p></div></article>`).join('');
$('recent').innerHTML=MUSIC.recent.map(r=>`<article class="recent-item"><div class="album" style="--color:${esc(r.color)}">${cover(r)}</div><span class="song-title">${esc(r.title)}</span><span class="artist">${esc(r.artist)}</span></article>`).join('');
const c=MUSIC.current;
$('open-player').innerHTML=`<span class="mini-cover">${cover(c)}</span><span class="mini-copy"><span class="mini-title" style="display:block">${esc(c.title)}</span><span class="mini-artist">${esc(c.artist)}</span></span>`;
document.querySelector('.tabs').innerHTML=[['home','홈'],['grid','새로운 음악'],['radio','라디오'],['library','보관함'],['search','검색']].map(([i,t],n)=>`<div class="tab ${n===0?'active':''}" aria-disabled="true">${icon(i)}<span>${t}</span></div>`).join('');
$('current').innerHTML=`<div class="current-cover">${cover(c)}</div><div class="current-copy"><div class="current-title">${esc(c.title)}</div><div class="current-artist">${esc(c.artist)}</div></div>${icon('star')}${icon('more')}`;
$('modes').innerHTML=['shuffle','repeat','infinity','mix'].map(i=>`<span class="mode" aria-hidden="true">${icon(i)}</span>`).join('');
$('queue').innerHTML=MUSIC.queue.map(r=>`<article class="queued"><div class="queue-cover" style="background:${esc(r.color)}">${cover(r)}</div><div class="queued-copy"><div class="queued-title">${esc(r.title)}</div><div class="queued-artist">${esc(r.artist)}</div></div></article>`).join('');
$('transport').innerHTML=icon('previous')+'<button class="play-toggle" id="station-toggle" aria-label="일시정지"></button>'+icon('next');$('mini-next').innerHTML=icon('next');$('volume').innerHTML=icon('speaker')+'<div class="track volume-track"><div class="track-fill" id="volume-fill"></div><input class="volume-range" id="volume-slider" type="range" min="0" max="100" value="16" step="1" aria-label="음량 조절"></div>'+icon('loud');$('player-tools').innerHTML=['speech','airplay','list'].map(i=>`<span class="${i==='list'?'selected':''}">${icon(i)}</span>`).join('');

// 실제 음원 없이도 음량 숫자·슬라이더 채움이 변경됩니다.
const volumeSlider=$('volume-slider'),volumeFill=$('volume-fill');
function updateVolume(){const value=Number(volumeSlider.value);volumeFill.style.width=value+'%';volumeSlider.setAttribute('aria-valuetext',value+'%')}
volumeSlider.addEventListener('input',updateVolume);
let volumePointer=null;
function setVolumeFromPointer(event){const r=volumeSlider.getBoundingClientRect();volumeSlider.value=Math.max(0,Math.min(100,Math.round((event.clientX-r.left)/r.width*100)));updateVolume()}
volumeSlider.addEventListener('pointerdown',event=>{volumePointer=event.pointerId;volumeSlider.setPointerCapture(event.pointerId);setVolumeFromPointer(event)});
volumeSlider.addEventListener('pointermove',event=>{if(volumePointer===event.pointerId)setVolumeFromPointer(event)});
const releaseVolume=event=>{if(volumePointer===event.pointerId)volumePointer=null};
volumeSlider.addEventListener('pointerup',releaseVolume);volumeSlider.addEventListener('pointercancel',releaseVolume);
updateVolume();
// 화면 높이가 달라도 세로 스크롤 없이 두 줄을 모두 표시합니다.
function fit(){const rec=$('recommendations'),recent=$('recent');rec.style.setProperty('--rec-width',Math.max(100,Math.min(innerWidth*.63,rec.clientHeight*.76))+'px');recent.style.setProperty('--album-size',Math.max(24,Math.min(innerWidth*.38,recent.clientHeight-40))+'px')}
new ResizeObserver(fit).observe(document.querySelector('.main'));window.addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);fit();
// 터치 스와이프, 마우스 드래그, 트랙패드 모두 가로 목록만 이동합니다.
for(const rail of document.querySelectorAll('.rail')){let start=null;rail.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;start={x:e.clientX,scroll:rail.scrollLeft};rail.setPointerCapture(e.pointerId);rail.style.scrollSnapType='none'});rail.addEventListener('pointermove',e=>{if(start)rail.scrollLeft=start.scroll+start.x-e.clientX});const stop=()=>{start=null;rail.style.scrollSnapType=''};rail.addEventListener('pointerup',stop);rail.addEventListener('pointercancel',stop);rail.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();rail.scrollLeft+=e.deltaY}},{passive:false})}
function openPlayer(){$('station').hidden=false;$('app').inert=true;$('open-player').setAttribute('aria-expanded','true')}
function closePlayer(){$('station').hidden=true;$('app').inert=false;$('open-player').setAttribute('aria-expanded','false');$('open-player').focus({preventScroll:true})}
$('open-player').addEventListener('click',openPlayer);
// 화면에 별도 버튼을 추가하지 않고 상단을 아래로 쓸어 닫습니다.
let down=null;$('station-top').addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};$('station-top').setPointerCapture(e.pointerId)});$('station-top').addEventListener('pointerup',e=>{if(down&&e.clientY-down.y>45&&e.clientY-down.y>Math.abs(e.clientX-down.x))closePlayer();down=null});$('station-top').addEventListener('pointercancel',()=>down=null);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('station').hidden)closePlayer()});
// 음원 없이 유지되는 재생 중 화면. 곡과 대기 목록은 자동으로 바뀌지 않습니다.
const format=s=>Math.floor(s/60)+':'+String(Math.floor(s)%60).padStart(2,'0');
let playing=true,position=c.elapsed,lastClock=performance.now();
function playbackPosition(){return Math.min(c.duration,position+(playing?(performance.now()-lastClock)/1000:0))}
// 진행바를 탭하거나 끌면 해당 구간으로 이동하며 경과/남은 시간도 즉시 바뀝니다.
const seekSlider=$('seek-slider');
seekSlider.max=c.duration;
let seekPointer=null;
function seekTo(seconds){position=Math.max(0,Math.min(c.duration,Number(seconds)));lastClock=performance.now();seekSlider.value=position;updateTime()}
function seekFromPointer(event){const bounds=seekSlider.getBoundingClientRect();if(bounds.width)seekTo((event.clientX-bounds.left)/bounds.width*c.duration)}
seekSlider.addEventListener('input',()=>seekTo(seekSlider.value));
seekSlider.addEventListener('pointerdown',event=>{seekPointer=event.pointerId;seekSlider.setPointerCapture(event.pointerId);seekFromPointer(event)});
seekSlider.addEventListener('pointermove',event=>{if(seekPointer===event.pointerId)seekFromPointer(event)});
const releaseSeek=event=>{if(seekPointer===event.pointerId){seekFromPointer(event);seekPointer=null;updateTime()}};
seekSlider.addEventListener('pointerup',releaseSeek);
seekSlider.addEventListener('pointercancel',event=>{if(seekPointer===event.pointerId){seekPointer=null;updateTime()}});
function updateTime(){const elapsed=playbackPosition();$('elapsed').textContent=format(elapsed);$('remaining').textContent='−'+format(c.duration-elapsed);$('progress').style.width=elapsed/c.duration*100+'%';if(seekPointer===null)$('seek-slider').value=elapsed;if(playing&&elapsed>=c.duration){position=c.duration;playing=false;updatePlayIcons()}}
function updatePlayIcons(){for(const id of ['mini-toggle','station-toggle']){const b=$(id);b.innerHTML=icon(playing?'pause':'play');b.setAttribute('aria-label',playing?'일시정지':'재생');b.setAttribute('aria-pressed',String(playing))}}
function togglePlayback(){position=playbackPosition();playing=!playing;if(playing&&position>=c.duration)position=0;lastClock=performance.now();updatePlayIcons();updateTime()}
for(const id of ['mini-toggle','station-toggle'])$(id).addEventListener('click',e=>{e.stopPropagation();togglePlayback()});updatePlayIcons();updateTime();setInterval(updateTime,250);
</script></body></html>
