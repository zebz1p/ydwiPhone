function updateTitle(){const el=document.querySelector('.small-title');if(el)el.style.opacity=String(Math.max(0,Math.min(1,($('content').scrollTop-12)/30)))}
function closeMenu(){$('menu-layer').hidden=true;$('menu-layer').innerHTML=''}
function openMenu(){if(selected!=='voicemail'||!state.restored)return;$('menu-layer').innerHTML=`<button class="dismiss-area" data-action="close-menu" aria-label="메뉴 닫기"></button><div class="menu" role="dialog" aria-label="녹음 메뉴">${[['share','공유',''],['edit','이름 변경',''],['wave','녹음 편집',''],['speech','전사문 보기','transcript'],['heart',state.favorite?'즐겨찾기 해제':'즐겨찾기','favorite'],['folder','이동','']].map(([i,t,a])=>`<button ${a?`data-action="${a}"`:'disabled'}>${icon(i)}${t}</button>`).join('')}</div>`;$('menu-layer').hidden=false}
function restorePrompt(){$('menu-layer').innerHTML=`<button class="dismiss-area" data-action="close-menu" aria-label="닫기"></button><div class="restore-box"><button data-action="confirm-restore">1개의 녹음 항목 복구</button></div>`;$('menu-layer').hidden=false;positionRestorePrompt()}
function positionRestorePrompt(){const box=document.querySelector('.restore-box'),bar=document.querySelector('.expanded .controls');if(!box||!bar)return;const bounds=bar.getBoundingClientRect();box.style.position='fixed';box.style.right='18px';box.style.top=Math.max(12,Math.min(window.innerHeight-box.offsetHeight-12,bounds.top-3))+'px'}
window.addEventListener('resize',positionRestorePrompt);
function restore(){state.restored=true;persist();closeMenu();pause();selected=null;page='all';$('content').scrollTop=0;render()}
// 장면별 침묵(초): 문구 앞에서 기다립니다. 실제 음원 없는 전사문 연출용 시간표입니다.
const SCENE_PAUSES=[
 ['아 밀지마.',1.2],['뭘 노려보노.',2],['너는 고백도',1.5],
 ['.... 형 우나?',5],['....... 하.',9],['비켜.',2],
 ['후회할 짓',3],['맞춰줘.',2],['...형 내일',5],
 ['아 잠깐.',1.2],['잠깐만.',2],['눈 감으라고',3],
 ['..................내일',18],['...또?',6]
].map(([phrase,seconds])=>({offset:TRANSCRIPT.indexOf(phrase),seconds}));
const TOKENS=[];let speechEnd=0,characterOffset=0;
for(const text of TRANSCRIPT.match(/\S+\s*/g)||[]){
 const dots=(text.match(/\./g)||[]).length;
 const spoken=text.replace(/[\s.,!?]/g,'');
 const scene=SCENE_PAUSES.filter(p=>p.offset>=characterOffset&&p.offset<characterOffset+text.length).reduce((sum,p)=>sum+p.seconds,0);
 // 말줄임표는 발화 전에 침묵으로 처리해 글자 강조도 잠시 멈춥니다.
 speechEnd+=scene||(dots>=3?Math.min(6,dots*.65):0);
 const duration=spoken.length?Math.max(.22,spoken.length*CHARACTER_SECONDS):.15;
 TOKENS.push({text,start:speechEnd,end:speechEnd+duration});
 speechEnd+=duration+(/[.!?]\s*$/.test(text)&&dots<3?.48:/,\s*$/.test(text)?.22:.045);
 characterOffset+=text.length;
}
function openTranscript(){closeMenu();origin=page;transcriptOpen=true;active='voicemail';selected='voicemail';$('app').inert=true;const r=record('voicemail');$('transcript-layer').innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="전사문"><div class="handle"></div><div class="sheet-bar"><button class="round" disabled aria-label="더 보기">${icon('more')}</button><button class="round done" data-action="close-transcript" aria-label="완료">${icon('check')}</button></div><div class="sheet-title"><strong>${esc(r.name)}</strong><small>2026. 11. 26. 오전 1:30 · 1:10:26</small></div><div class="words" id="words">“${TOKENS.map((t,i)=>`<button type="button" class="word" data-word="${i}" aria-label="${esc(t.text.trim())}, 여기로 이동">${esc(t.text.trimEnd())}</button>${/\s$/.test(t.text)?' ':''}`).join('')}”</div><div class="transcript-player"><div class="big-clock" id="big-clock">00:00.00</div><input class="seek" data-seek type="range" min="0" max="4226" step=".1" value="${state.positions.voicemail||0}" aria-label="전사문 재생 위치"><div class="times"><span data-elapsed>0:00</span><span data-remaining>−1:10:26</span></div><div class="transcript-controls"><button class="control skip" data-action="rewind" aria-label="15초 뒤로">${icon('rewind')}</button><button class="control play" data-action="play" data-play-icon aria-label="재생">${icon('play')}</button><button class="control skip" data-action="forward" aria-label="15초 앞으로">${icon('forward')}</button></div><div class="sheet-actions"><button class="round speech-active" disabled aria-label="전사문">${icon('speech')}</button><button class="replace" disabled>대치</button><button class="round" disabled aria-label="옵션">${icon('sliders')}</button></div></div></section>`;$('transcript-layer').hidden=false;activeWord=-1;followUntil=0;$('words').addEventListener('pointerdown',()=>followUntil=performance.now()+4500);$('words').addEventListener('wheel',()=>followUntil=performance.now()+4500,{passive:true});updatePlayer(true)}
function scrollToWord(index){const words=$('words'),word=document.querySelector(`[data-word="${index}"]`);if(!words||!word)return;const a=word.getBoundingClientRect(),b=words.getBoundingClientRect();words.scrollTo({top:Math.max(0,words.scrollTop+a.top-b.top-b.height*.3),behavior:'smooth'})}
function closeTranscript(){pause();transcriptOpen=false;$('transcript-layer').hidden=true;$('transcript-layer').innerHTML='';$('app').inert=false;render()}
function updatePlayer(force=false){const id=active||selected;if(!id)return;const pos=active?currentTime():state.positions[id]||0,dur=total(id);document.querySelectorAll('[data-seek]').forEach(el=>{el.value=pos;el.max=dur||1;el.style.setProperty('--progress',(dur?pos/dur*100:0)+'%')});document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=format(pos));document.querySelectorAll('[data-remaining]').forEach(el=>el.textContent='−'+format(dur||NaN));document.querySelectorAll('[data-play-icon]').forEach(el=>{const mode=playing?'pause':'play';if(el.dataset.playState!==mode){el.innerHTML=icon(mode);el.dataset.playState=mode;el.setAttribute('aria-label',playing?'일시정지':'재생')}});if(transcriptOpen){const hundredths=Math.floor((pos%1)*100);$('big-clock').textContent=format(pos).padStart(5,'0')+'.'+String(hundredths).padStart(2,'0');const idx=TOKENS.findIndex(t=>pos>=t.start&&pos<t.end);if(idx!==activeWord||force){document.querySelectorAll('.word.active').forEach(el=>el.classList.remove('active'));const el=document.querySelector(`[data-word="${idx}"]`);if(el){el.classList.add('active');const words=$('words');if(performance.now()>followUntil){const a=el.getBoundingClientRect(),b=words.getBoundingClientRect();if(a.top<b.top+20||a.bottom>b.bottom-30)words.scrollTo({top:words.scrollTop+a.top-b.top-b.height*.3,behavior:'smooth'})}}activeWord=idx}}}
function tick(){if(playing){if(record(active).silent&&currentTime()>=total(active)){state.positions[active]=total(active);playing=false;persist()}updatePlayer()}requestAnimationFrame(tick)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.word!==undefined&&transcriptOpen){const token=TOKENS[Number(b.dataset.word)];if(token){followUntil=performance.now()+900;seek(token.start);scrollToWord(Number(b.dataset.word))}return}if(b.dataset.page){pause();page=b.dataset.page;selected=null;active=null;$('content').scrollTop=0;render();return}if(b.dataset.id){select(b.dataset.id);return}switch(b.dataset.action){case 'play':play();break;case 'rewind':seek(currentTime()-15);break;case 'forward':seek(currentTime()+15);break;case 'menu':openMenu();break;case 'close-menu':closeMenu();break;case 'restore':restorePrompt();break;case 'confirm-restore':restore();break;case 'favorite':state.favorite=!state.favorite;persist();closeMenu();render();break;case 'transcript':openTranscript();break;case 'close-transcript':closeTranscript();break}});
document.addEventListener('input',e=>{if(e.target.matches('[data-seek]'))seek(Number(e.target.value))});$('content').addEventListener('scroll',updateTitle,{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('menu-layer').hidden)closeMenu();else if(transcriptOpen)closeTranscript()}});
for(const r of RECORDINGS.filter(r=>!r.silent)){const a=new Audio();a.preload='metadata';a.src='sound/'+encodeURIComponent(r.file)+'.mp3';audios.set(r.id,a);a.addEventListener('loadedmetadata',()=>{if(Number.isFinite(a.duration)){r.duration=a.duration;document.querySelectorAll(`[data-duration="${r.id}"]`).forEach(el=>el.textContent=format(r.duration));if(selected===r.id)updatePlayer()}});a.addEventListener('ended',()=>{if(active===r.id){state.positions[r.id]=a.duration;playing=false;persist();updatePlayer()}});a.addEventListener('error',()=>{errors.add(r.id);if(active===r.id){playing=false;render()}})}
window.addEventListener('pagehide',()=>{pause();persist()});window.addEventListener('pageshow',e=>{if(e.persisted){try{sessionStorage.removeItem(storageKey)}catch(e){}location.reload()}});render();requestAnimationFrame(tick);
</script></body></html>
