<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="theme-color" content="#ffffff">
<title>윤도운의 iPhone</title>
<style>
:root{--blue:#007aff;--ink:#111;--secondary:#929399;--border:#e5e5e8;--screen:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--screen);-webkit-text-size-adjust:100%}
body,button,input{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:1;cursor:default}
[hidden]{display:none!important}
svg{display:block}
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;background:white;overflow:hidden}
/* 목록 상단은 고정, 큰 제목만 본문과 함께 스크롤 */
.top-bar{flex:none;height:61px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 14px;background:#fff;border-bottom:1px solid #ededee;position:relative;z-index:4}
.top-side{display:flex;align-items:center}.top-side.right{justify-content:flex-end}
.pill{height:39px;min-width:55px;padding:0 15px;background:#fff;border:1px solid #dedee2;border-radius:23px;display:grid;place-items:center;font-size:17px;font-weight:440;white-space:nowrap}
.pill.circle{width:40px;min-width:40px;padding:0;border-radius:50%}.pill svg{width:22px;height:22px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top-title{grid-column:2;text-align:center;font-size:17px;font-weight:650;white-space:nowrap;opacity:0;transform:translateY(9px);transition:opacity .12s ease,transform .12s ease;pointer-events:none}
#app.is-compact .top-title{opacity:1;transform:translateY(0)}
.scroll-region{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:#fff}
.scroll-region::-webkit-scrollbar{display:none}
.list-scroll-content{min-height:calc(100% + 240px);padding:0 0 30px}
.large-title{margin:0;padding:14px 17px 13px;font-size:36px;font-weight:750;line-height:1.25;letter-spacing:-1.3px}
/* 대화 목록 */
.conversation-row{width:100%;min-height:82px;display:flex;align-items:center;gap:12px;padding:0 17px;text-align:left;background:white;border:0;cursor:pointer}
.conversation-row:active{background:#f6f7f9}
.conversation-row.is-static{cursor:default;pointer-events:none;user-select:none;-webkit-user-select:none}
.conversation-row.is-static:active{background:#fff}
.avatar{width:45px;height:45px;flex:none;display:grid;place-items:center;border-radius:50%;background:linear-gradient(160deg,#a7c7e4 0%,#8887c0 100%);color:white;font-size:24px;font-weight:630;line-height:1;overflow:hidden}
.avatar .person-icon{height:100%;width:100%}
.row-core{min-height:82px;flex:1;min-width:0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:8px 0;gap:3px}
.row-line{display:flex;align-items:center;gap:8px;min-width:0}
.contact-name{font-size:16px;line-height:20px;font-weight:650;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.preview-line{font-size:13.5px;line-height:18px;color:#898990;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row-preview{white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;font-size:13.5px;line-height:18px;color:#8d8d94;overflow-wrap:anywhere}
.row-time{margin-left:auto;flex:none;font-size:12.5px;line-height:18px;color:#919197;white-space:nowrap;font-weight:400;align-self:center}
.row-chevron{width:14px;height:18px;flex:none;stroke:#c7c7cc;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-left:2px;align-self:center}
/* 상·하단 컨트롤은 보이는 모양만 구현하고 작동시키지 않음 */
.bottom-bar{flex:none;height:calc(79px + env(safe-area-inset-bottom,0px));padding:9px 15px calc(11px + env(safe-area-inset-bottom,0px));border-top:1px solid #e5e5e9;background:#fff;display:flex;align-items:center;gap:10px;z-index:4}
.search-pill{height:48px;border:1px solid #dddde1;border-radius:28px;min-width:0;flex:1;display:flex;align-items:center;padding:0 14px;gap:12px;color:#a0a0a5;font-size:17px;pointer-events:none}
.search-icon{width:22px;height:22px;color:#080808;flex:none}.search-mic{margin-left:auto;width:18px;height:23px;color:#0e0e0e}
.compose-icon{height:48px;width:48px;flex:none;border-radius:50%;border:1px solid #dddde1;background:#fff;display:grid;place-items:center;pointer-events:none}.compose-icon svg{width:22px;height:22px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 대화 상세: 기존 call 코드의 문자 화면처럼 고정 헤더, 본문 스크롤, 고정 입력바 */
.chat-head{flex:none;height:98px;display:grid;grid-template-columns:1fr 3fr 1fr;align-items:center;padding:5px 16px 10px;border-bottom:1px solid var(--border);background:#fff}
.chat-back{justify-self:start;width:38px;height:38px;border-radius:22px;border:1px solid #e5e5e7;background:white;display:grid;place-items:center;cursor:pointer}.chat-back svg{height:20px;width:20px;stroke:#111;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chat-contact{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.chat-contact .avatar{width:44px;height:44px;font-size:24px}
.chat-contact-name{font-size:15px;font-weight:500;white-space:nowrap;letter-spacing:-.25px}
.chat-video{justify-self:end;width:39px;height:39px;display:grid;place-items:center;color:#606066}.chat-video svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chat-body{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;background:#fff}.chat-body::-webkit-scrollbar{display:none}
.chat-messages{min-height:calc(100% + 180px);padding:15px 16px 22px;display:flex;flex-direction:column;justify-content:flex-start;gap:3px}
.chat-secure{color:#a0a0a6;text-align:center;font-size:11px;line-height:1.5;padding:4px 0 10px}.chat-secure svg{display:inline-block;width:12px;height:12px;vertical-align:-2px}
.time-separator{text-align:center;font-size:11px;font-weight:500;color:#a0a0a6;margin:19px 0 13px}
.message-row{width:100%;display:flex;align-items:flex-end}
.message-row.sent{justify-content:flex-end}.message-row.received{justify-content:flex-start}
.bubble{position:relative;max-width:min(79%,390px);border-radius:19px;padding:10px 14px;font-size:15px;line-height:1.47;white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}
.message-row.sent .bubble{background:#007aff;color:#fff}.message-row.received .bubble{background:#e9e9eb;color:#111}
.bubble-tail{position:absolute;bottom:-7px;height:21px;width:24px;pointer-events:none;overflow:visible;stroke:none}
.message-row.sent .bubble-tail{right:7px;fill:#007aff}.message-row.received .bubble-tail{left:7px;fill:#e9e9eb;transform:scaleX(-1)}
.chat-footer{height:calc(54px + env(safe-area-inset-bottom,0px));flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #e8e8ed;background:#fafafa;color:#95959a}
.chat-plus{width:27px;height:27px;display:grid;place-items:center;flex:none}.chat-plus svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.chat-faux-input{height:38px;flex:1;display:flex;align-items:center;border:1px solid #dcdce2;border-radius:22px;padding:0 13px;background:#fff;color:#bcbcc2;font-size:16px;min-width:0}
.chat-mic{width:24px;height:25px;flex:none;display:grid;place-items:center}.chat-mic svg{height:22px;width:22px;stroke:currentColor;stroke-width:2;fill:none}
@media(max-width:350px){.conversation-row{padding:0 12px;gap:9px}.row-time{font-size:11px}.contact-name{font-size:15px}.avatar{width:41px;height:41px}.bottom-bar{padding-left:10px;padding-right:10px}.chat-messages{padding-left:13px;padding-right:13px}.bubble{max-width:86%}}
@media(prefers-reduced-motion:reduce){.top-title{transition:none}}
/* 참고 이미지 기반: 화면 가득 도운이 영상 + 위쪽에 5개 동그란 제어 버튼 */
#ft-video-call{position:fixed;inset:0;height:100%;height:100dvh;width:100%;z-index:1100;overflow:hidden;background:#090a0c;color:#fff;isolation:isolate}
#ft-video-call video{display:block}
#ft-dowoon-video{position:absolute;inset:0;height:100%;width:100%;object-fit:cover;object-position:center;background:#14181d}
.ft-video-overlay{pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.14) 27%,transparent 48%,rgba(0,0,0,.07))}
.ft-call-top{position:absolute;z-index:2;left:clamp(17px,5vw,35px);top:calc(36px + env(safe-area-inset-top,0px));text-shadow:0 1px 7px #0008}
.ft-call-name{font-size:clamp(21px,5vw,27px);font-weight:660;letter-spacing:-.6px}
.ft-call-duration{font-size:13px;color:#efeff2;line-height:1.5;margin-top:3px;font-variant-numeric:tabular-nums}
.ft-call-controls{position:absolute;z-index:4;top:calc(128px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(3px,1.6vw,12px);width:min(620px,calc(100% - 20px));padding:0;align-items:start}
.ft-control{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;min-width:0;color:#fff;font-size:clamp(10px,2.7vw,12px);font-weight:500;text-shadow:0 1px 6px #0009}
.ft-control-circle{width:clamp(49px,13.2vw,68px);height:clamp(49px,13.2vw,68px);border-radius:50%;background:rgba(77,80,89,.46);display:grid;place-items:center;transition:background .16s,color .16s}
.ft-control-circle svg{width:clamp(23px,6vw,29px);height:clamp(23px,6vw,29px);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ft-control:active .ft-control-circle{filter:brightness(1.15)}
.ft-control[aria-pressed="true"] .ft-control-circle{background:rgba(245,245,247,.79);color:#202124}
.ft-control-circle.ft-control-end{background:#ff453a}
.ft-control-end svg{stroke:#fff;stroke-width:2.8}
.ft-control[disabled]{opacity:1;cursor:default}
.ft-control[disabled]:active .ft-control-circle{filter:none}
/* 작은 영상은 드래그 가능: 화면 밖으로 못 나가도록 자바스크립트에서 제한합니다. */
.ft-pip{position:absolute;z-index:5;right:15px;top:44%;width:clamp(112px,29vw,184px);height:clamp(155px,40vw,250px);border-radius:15px;border:1px solid #ffffff73;overflow:hidden;background:#30343a;box-shadow:0 5px 22px #0009;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:left,top}
.ft-pip.dragging{cursor:grabbing;box-shadow:0 9px 24px #000b}
#ft-yeonghyeon-video{width:100%;height:100%;object-fit:cover;object-position:50% 75%;pointer-events:none}
.ft-pip-label{position:absolute;bottom:8px;left:10px;font-size:11px;font-weight:650;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none}
#ft-camera-off{position:absolute;inset:0;display:grid;place-items:center;background:#30343a;font-size:13px;font-weight:650;pointer-events:none}
#ft-video-play{position:absolute;z-index:7;left:50%;top:63%;transform:translate(-50%,-50%);background:#fff;color:#161618;padding:12px 20px;border-radius:22px;white-space:nowrap;font-size:13px;font-weight:700;box-shadow:0 5px 16px #0007}
@media(max-width:355px){#ft-mini-call{gap:7px;padding:8px 9px 8px 14px;min-height:60px}.ft-mini-btn{width:40px;height:40px;flex-basis:40px}.ft-mini-btn svg{width:21px;height:21px}.ft-mini-name{font-size:14px}.ft-mini-type{font-size:10px}.ft-call-controls{top:calc(119px + env(safe-area-inset-top,0px))}}
@media(max-height:575px){.ft-call-top{top:calc(10px + env(safe-area-inset-top,0px))}.ft-call-controls{top:calc(85px + env(safe-area-inset-top,0px))}.ft-pip{height:125px;width:95px}}
@media(prefers-reduced-motion:reduce){#ft-mini-call{transition:none}}

/* FaceTime 버튼은 iMessage 공통 svg보다 독립 스타일 우선 */
#ft-mini-call svg,#ft-video-call svg{fill:none;stroke:currentColor}
#ft-mini-call .ft-mini-btn svg{fill:#fff;stroke:none}
#ft-mini-call .ft-mini-btn.reject svg{fill:#fff;stroke:none}
#ft-mini-call .ft-mini-btn.accept svg{fill:#fff;stroke:none}
#ft-video-call .ft-control-end svg{fill:none;stroke:currentColor}


#ft-video-call[hidden]{display:none!important}.ft-pip{cursor:default}.ft-msg-stack{position:absolute;bottom:28px;left:14px;right:14px;z-index:8;display:flex;flex-direction:column;gap:8px}.ft-msg{background:rgba(248,248,250,.95);color:#111;border-radius:17px;padding:12px 16px;font-size:14px;line-height:1.5}.ft-msg strong{display:block;font-size:13px}.ft-connecting{position:absolute;inset:0;z-index:1;background:#17191e;display:grid;place-content:center;text-align:center;gap:14px;font-size:19px}.ft-connecting[hidden]{display:none}.ft-connecting small{color:#aaa;font-size:14px}

/* 브라우저 기본 버튼 테두리 제거 */
button.chat-video{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;box-shadow:none;outline:none}
.ft-pip{cursor:grab}.ft-pip.dragging{cursor:grabbing}
.ft-msg-stack{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;max-height:45%;overflow:auto;scrollbar-width:none;pointer-events:none}
.ft-msg{display:flex;gap:11px;align-items:center;pointer-events:auto;touch-action:pan-x;flex:none;padding:13px;border-radius:20px;background:rgba(250,250,252,.96);box-shadow:0 4px 18px #0002}
.ft-message-icon{width:42px;height:42px;flex:none;background:#34c759;border-radius:11px;display:grid;place-items:center}
#ft-video-call .ft-message-icon svg{width:30px;height:30px;fill:white;stroke:none}.ft-message-copy{flex:1;min-width:0}.ft-message-copy strong{margin-bottom:3px}.ft-message-close{border:0;background:none;color:#777;font-size:22px;width:26px;height:28px;padding:0;align-self:flex-start}

/* 모든 알림이 하나의 아래쪽 경계를 공유합니다. */
.ft-msg-stack{display:block;height:0;transition:height .36s cubic-bezier(.22,.65,.3,1);max-height:none;overflow:hidden}
.ft-msg-mask{position:absolute;left:0;right:0;bottom:0;overflow:visible;transition:transform .36s cubic-bezier(.22,.65,.3,1);will-change:transform}
.ft-msg-mask.leaving{pointer-events:none}
.ft-msg{animation:none}
/* iMessage 입력창 위 선택지: 회색 배경 없이 흰색 카드만 표시 */
.yh-reply-options{flex:none;display:flex;flex-direction:column;gap:10px;padding:10px 16px 15px;background:transparent;border-top:0}
.yh-reply-option{width:100%;min-height:42px;padding:11px 14px;border:1px solid #dce0e7;border-radius:16px;background:#fff;color:#007aff;text-align:center;font-size:14px;font-weight:500;line-height:1.45;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.yh-reply-option:active{background:#edf4ff}
.bubble.image-bubble{padding:6px;max-width:min(67%,240px);overflow:hidden}
.bubble-photo{display:block;width:100%;height:auto;border-radius:13px;background:#d9d9df}
.bubble-photo-fallback{display:grid;place-items:center;gap:8px;width:180px;max-width:100%;aspect-ratio:3/4;border-radius:13px;background:#d7d7dc;color:#4b4b52;text-align:center;padding:12px}
.bubble-photo-fallback svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.8}
.bubble-photo-fallback span{font-size:13px;line-height:1.35;word-break:break-all}
.message-row.received .bubble.image-bubble{background:#e9e9eb}
.message-row.sent .bubble.image-bubble{background:#007aff}
.message-row.sent .bubble.image-bubble .bubble-photo-fallback{background:rgba(255,255,255,.18);color:#fff}
.message-row.sent .bubble.image-bubble .bubble-photo-fallback svg{stroke:currentColor}
</style>
</head>
<body>
<div id="app">
  <header class="top-bar" id="inbox-header">
    <div class="top-side"><button type="button" class="pill" disabled>편집</button></div>
    <div class="top-title">메시지</div>
    <div class="top-side right"><button type="button" class="pill circle" disabled aria-label="필터"><svg viewBox="0 0 24 24"><path d="M3 7h18M6 12h12M9 17h6"/></svg></button></div>
  </header>
  <main class="scroll-region" id="inbox-scroll" aria-label="메시지 목록">
    <div class="list-scroll-content">
      <h1 class="large-title">메시지</h1>
      <div id="conversation-list"></div>
    </div>
  </main>
  <footer class="bottom-bar" id="inbox-footer">
    <div class="search-pill" aria-label="검색 비활성화"><svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.2" stroke="currentColor" stroke-width="2.6"/><path d="m15 15 6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>검색</span><svg class="search-mic" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M5.5 11.5A6.5 6.5 0 0 0 18.5 11.5M12 18v4m-4 0h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
  </footer>
  <header class="chat-head" id="detail-header" hidden></header>
  <main class="chat-body" id="detail-scroll" hidden></main>
  <div id="yh-reply-options" class="yh-reply-options" aria-label="답장 선택" hidden></div>
  <footer class="chat-footer" id="detail-footer" hidden>
    <span class="chat-plus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M6 12h12"/></svg></span>
    <span class="chat-faux-input">iMessage</span>
    <span class="chat-mic"><svg viewBox="0 0 24 24"><path d="M12 3v18M8.5 8v8M15.5 7v10M5 11v2M19 10v4"/></svg></span>
  </footer>
</div>
<section id="ft-video-call" role="dialog" aria-label="FaceTime 영상 통화 화면" aria-modal="true" hidden>
  <video id="ft-dowoon-video" src="vid/dwfacetime.MP4" loop playsinline webkit-playsinline preload="auto"></video>
  <div class="ft-video-overlay"></div>
  <div class="ft-call-top"><div class="ft-call-name">영현이 형</div><div class="ft-call-duration" id="ft-call-duration">FaceTime 영상 통화 · 00:00</div></div>
  <div class="ft-pip" id="ft-yeonghyeon-pip" aria-label="강영현 카메라 꺼짐">
    
    <span class="ft-pip-label">강영현</span><div id="ft-camera-off">카메라 꺼짐</div>
  </div>
  <div class="ft-call-controls" aria-label="영상 통화 조작">
    <button type="button" class="ft-control" id="ft-speaker" disabled aria-pressed="true" aria-label="스피커 음량 조절"><span class="ft-control-circle"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a5 5 0 0 1 0 6M18 5a10 10 0 0 1 0 14"/></svg></span><span>스피커</span></button>
    <button type="button" class="ft-control" id="ft-camera" disabled aria-pressed="false"><span class="ft-control-circle"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="15" height="12" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg></span><span id="ft-camera-label">카메라</span></button>
    <button type="button" class="ft-control" id="ft-mute" disabled aria-pressed="false"><span class="ft-control-circle"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 11.6 5.2M12 18v4M8 22h8M3 3l18 18"/></svg></span><span id="ft-mute-label">소리 끔</span></button>
    <button type="button" class="ft-control" id="ft-share" disabled aria-label="공유 (미지원)"><span class="ft-control-circle"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="18" height="13" rx="2"/><circle cx="17" cy="9" r="2" fill="currentColor" stroke="none"/><path d="M13.8 16c0-3.4 6.5-3.4 6.5 0"/></svg></span><span>공유</span></button>

 appendYhPostMessage('me',label);
 switch(yhStoryStage){
  case 'stage1': runYhAfterStage1(choiceId); break;
  case 'stage2': runYhAfterStage2(choiceId); break;
  case 'stage3': runYhAfterStage3(choiceId); break;
  case 'stage4': runYhAfterStage4(choiceId); break;
 }
}
function startYhPostCall(){
 if(yhFtPostStarted||yhFtChat<0)return;
 yhFtPostStarted=true;
 queueYhSequence([
  {from:'me',text:'미쳤나진짜기찬데'},
  {from:'them',text:'ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ'},
  {from:'them',text:'아니 원하는 거 같길래~'}
 ],()=>setYhChoiceStage('stage1'),{postCallIntro:true});
}
$('yh-reply-options').addEventListener('click',event=>{
 const option=event.target.closest('[data-yh-choice]');
 if(!option||!yhStoryStage||yhStoryBusy||currentChat!==yhFtChat)return;
 const choiceSet=YH_CHOICE_SETS[yhStoryStage]||[];
 const choice=choiceSet.find(item=>item.id===option.dataset.yhChoice);
 if(!choice)return;
 yhStoryBusy=true;
 renderYhChoices();
 handleYhChoice(choice.id,choice.label);
});
function layoutFtNotices(){
 const stack=$('ft-msg-stack');
 const cards=Array.from(stack.children).filter(card=>!card.classList.contains('leaving'));
 const contentHeight=cards.reduce((sum,card)=>sum+card.offsetHeight,0)+Math.max(0,cards.length-1)*8;
 const height=Math.max(Number(stack.dataset.height)||0,contentHeight);
 stack.dataset.height=height;stack.style.height=height+'px';
 let offset=0;
 for(const card of cards.reverse()){
  card.style.transform='translateY(-'+offset+'px)';
  offset+=card.offsetHeight+8;
 }
}
function dismissFtNotice(notice){
 if(!notice||notice.classList.contains('leaving'))return;
 notice.classList.add('leaving');
 notice.style.transform='translateY('+(notice.offsetHeight+12)+'px)';
 // 아래 알림이 빠져나가는 동시에 위 알림이 빈자리로 내려옵니다.
 layoutFtNotices();setTimeout(()=>notice.remove(),360);
}
function clearFtNotices(){
 const stack=$('ft-msg-stack');
 const cards=Array.from(stack.children).filter(card=>!card.classList.contains('leaving'));
 // 개별 재정렬 없이 모두 같은 거리만큼 내려보내 간격을 유지합니다.
 const distance=Number(stack.dataset.height)||stack.offsetHeight;
 let offset=0;
 for(const card of cards.reverse()){
  const restingOffset=offset;offset+=card.offsetHeight+8;
  card.classList.add('leaving');
  card.style.transition='transform .5s cubic-bezier(.4,0,.7,1)';
  card.style.transform='translateY('+(distance+12-restingOffset)+'px)';
 }
 setTimeout(()=>cards.forEach(card=>card.remove()),500);
}
function ftLater(fn,ms){yhFtTimers.push(setTimeout(()=>{if(yhFtMode!=='idle')fn()},ms))}
function endYhFaceTime(startPostCall=false){
 const wasCalling=yhFtMode!=='idle';
 yhFtMode='idle';yhFtTimers.forEach(clearTimeout);yhFtTimers=[];clearInterval(yhFtClock);yhFtClock=null;
 $('ft-ring').pause();$('ft-ring').currentTime=0;$('ft-dowoon-video').pause();
 $('ft-video-call').hidden=true;$('app').inert=false;$('ft-msg-stack').innerHTML='';
 if(startPostCall&&wasCalling&&currentChat===yhFtChat){
  // 직접 일찍 끊더라도 통화 중 강영현이 보낸 문자들이 대화에 남아 있도록 보완.
  const chat=CHATS[yhFtChat];
  const texts=['나 씻는 중','왜 안 끊어?','미친놈 아니야 이거','ㅋㅋㅋㅋㅋ','뭘 바라는 건데','켜줘?'];
  if(!yhFtGroup){yhFtGroup={time:'2026년 12월 16일',faceTimeGenerated:true,messages:[]};chat.groups.push(yhFtGroup)}
  for(const text of texts){
   if(!yhFtRecorded.has(text)){yhFtGroup.messages.push({from:'them',text});yhFtRecorded.add(text)}
  }
  $('detail-scroll').innerHTML=renderChatBody(chat);
  $('detail-scroll').scrollTop=$('detail-scroll').scrollHeight;
  renderList();
  startYhPostCall();
 }
}
function appendYhFtMessage(text){
 const chat=CHATS[yhFtChat];if(!chat)return;
 if(!yhFtRecorded.has(text)){
  if(!yhFtGroup){yhFtGroup={time:'2026년 12월 16일',faceTimeGenerated:true,messages:[]};chat.groups.push(yhFtGroup)}
  yhFtGroup.messages.push({from:'them',text});yhFtRecorded.add(text);
 }
 const mask=document.createElement('div');mask.className='ft-msg-mask';
 const notice=document.createElement('div');notice.className='ft-msg';mask.appendChild(notice);
 notice.innerHTML='<span class="ft-message-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4C8 4 2 9 2 15c0 3 2 6 5 8l-1 5 6-3c2 1 3 1 4 1 8 0 14-5 14-11S24 4 16 4Z"/></svg></span><div class="ft-message-copy"><strong>영현이 형</strong><span></span></div><button type="button" class="ft-message-close" aria-label="알림 닫기">×</button>';
 notice.querySelector('.ft-message-copy span').textContent=text;
 const dismiss=()=>dismissFtNotice(mask);notice.querySelector('button').addEventListener('click',dismiss);
 let swipe=null;notice.addEventListener('pointerdown',event=>{if(event.target.closest('button'))return;swipe={x:event.clientX,y:event.clientY};notice.setPointerCapture(event.pointerId)});
 notice.addEventListener('pointermove',event=>{if(swipe&&swipe.y-event.clientY>30&&Math.abs(swipe.x-event.clientX)<90){swipe=null;dismiss()}});
 notice.addEventListener('pointerup',()=>{swipe=null});notice.addEventListener('pointercancel',()=>{swipe=null});
 const emptyStack=!$('ft-msg-stack').children.length;
 if(emptyStack){$('ft-msg-stack').style.transition='none';$('ft-msg-stack').dataset.height='0';$('ft-msg-stack').style.height='0px'}
 mask.style.transition='none';$('ft-msg-stack').prepend(mask);layoutFtNotices();void mask.offsetHeight;mask.style.transition='';$('ft-msg-stack').style.transition='';ftLater(dismiss,10000);
 // 통화 화면 아래의 대화에도 실제로 반영합니다.
 if(currentChat===yhFtChat){$('detail-scroll').innerHTML=renderChatBody(chat);$('detail-scroll').scrollTop=$('detail-scroll').scrollHeight;renderYhChoices();}
 renderList();
}
function startYhFaceTime(){
 if(currentChat<0||CHATS[currentChat].name!=='영현이 형')return;
 endYhFaceTime();yhFtChat=currentChat;yhFtMode='connecting';
 $('app').inert=true;$('ft-video-call').hidden=false;$('ft-connecting').hidden=true;
 $('ft-call-duration').textContent='연결 중...';$('ft-msg-stack').innerHTML='';
 const video=$('ft-dowoon-video');video.currentTime=0;video.muted=false;video.volume=.65;video.play().catch(()=>{});
 const ring=$('ft-ring');ring.volume=.4;ring.currentTime=0;ring.play().catch(()=>{});
 ftLater(()=>{
  ring.pause();ring.currentTime=0;yhFtMode='active';$('ft-connecting').hidden=true;
  video.play().catch(()=>{});yhFtStarted=Date.now();
  const clock=()=>{const t=Math.floor((Date.now()-yhFtStarted)/1000);$('ft-call-duration').textContent='FaceTime 영상 통화 · '+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};clock();yhFtClock=setInterval(clock,250);
  const sequence=[
   [4000,'나 씻는 중'],[6000,'왜 안 끊어?'],[8000,'미친놈 아니야 이거'],
   [13000,'ㅋㅋㅋㅋㅋ'],[15000,'뭘 바라는 건데'],[17000,'켜줘?']
  ];
  sequence.forEach(([at,text])=>{
   ftLater(()=>{const cards=Array.from($('ft-msg-stack').children).filter(n=>!n.classList.contains('leaving'));if(cards.length>=2)dismissFtNotice(cards[cards.length-1])},at-400);
   ftLater(()=>appendYhFtMessage(text),at);
  });
  // 두 번째 묶음 전에 아래 알림부터 차례로 내려보냅니다.
  ftLater(clearFtNotices,12000);
  ftLater(clearFtNotices,21000);
  ftLater(()=>endYhFaceTime(true),22000);
 },5000);
}
// 카메라가 꺼져 있어도 작은 화면을 손가락·마우스로 이동할 수 있습니다.
const yhPip=$('ft-yeonghyeon-pip');let yhPipDrag=null;
function clampPip(left,top){const box=$('ft-video-call').getBoundingClientRect();yhPip.style.right='auto';yhPip.style.left=Math.max(8,Math.min(left,box.width-yhPip.offsetWidth-8))+'px';yhPip.style.top=Math.max(8,Math.min(top,box.height-yhPip.offsetHeight-8))+'px'}
yhPip.addEventListener('pointerdown',event=>{const rect=yhPip.getBoundingClientRect();yhPipDrag={id:event.pointerId,x:event.clientX-rect.left,y:event.clientY-rect.top};yhPip.setPointerCapture(event.pointerId);yhPip.classList.add('dragging');event.preventDefault()});
yhPip.addEventListener('pointermove',event=>{if(!yhPipDrag||event.pointerId!==yhPipDrag.id)return;const box=$('ft-video-call').getBoundingClientRect();clampPip(event.clientX-box.left-yhPipDrag.x,event.clientY-box.top-yhPipDrag.y)});
function stopPipDrag(){yhPipDrag=null;yhPip.classList.remove('dragging')}
yhPip.addEventListener('pointerup',stopPipDrag);yhPip.addEventListener('pointercancel',stopPipDrag);
window.addEventListener('resize',()=>{if(yhFtMode==='idle')return;const rect=yhPip.getBoundingClientRect(),box=$('ft-video-call').getBoundingClientRect();clampPip(rect.left-box.left,rect.top-box.top)});
$('detail-header').addEventListener('click',event=>{if(event.target.closest('#yh-facetime'))startYhFaceTime()});
$('ft-end').addEventListener('click',()=>endYhFaceTime(true));
window.addEventListener('pagehide',()=>{endYhFaceTime();clearYhStoryTimers();yhStoryStage='';yhStoryBusy=false;$('yh-reply-options').hidden=true;});
window.addEventListener('pageshow',event=>{if(event.persisted){endYhFaceTime();clearYhStoryTimers();yhFtRecorded.clear();yhFtGroup=null;yhFtPostStarted=false;yhStoryStage='';yhStoryBusy=false;CHATS.forEach(chat=>{chat.groups=(chat.groups||[]).filter(group=>!group.faceTimeGenerated)});if(currentChat>=0)openChat(currentChat);renderList();renderYhChoices();}});
renderList();updateCompactTitle();
</script>
